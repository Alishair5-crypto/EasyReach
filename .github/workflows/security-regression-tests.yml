name: Security regression tests

on:
  push:
    branches: [test/security-regression-suite]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run security regression tests
        run: npm test
      - name: Type-check application and tests
        run: npm run typecheck
